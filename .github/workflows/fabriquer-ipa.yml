# Fabrique l'app iPhone sur un Mac de GitHub, sans signature.
# Le fichier Cercle.ipa est ensuite signé et installé depuis Windows avec Sideloadly (Apple ID gratuit).
name: Fabriquer l'app (.ipa)

on:
  push:
    branches: [main]
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

concurrency:                # un nouvel envoi annule la fabrication précédente encore en cours
  group: fabriquer-ipa
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Choisir Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode depuis project.yml
        run: xcodegen generate

      # L'adresse de la base et sa clé publique viennent des secrets du dépôt : elles ne sont jamais dans le code.
      # (La clé publique est faite pour être dans une app : les règles de la base la rendent inoffensive.)
      - name: Ajouter l'adresse de la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            URL="${SUPABASE_URL%/}"; URL="${URL%/rest/v1}"
            /usr/libexec/PlistBuddy -c "Set :SupabaseURL $URL" Support/Info.plist
            /usr/libexec/PlistBuddy -c "Set :SupabaseKey $SUPABASE_PUBLISHABLE_KEY" Support/Info.plist
            echo "Adresse de la base ajoutée."
          else
            echo "::warning::Secrets SUPABASE_URL et SUPABASE_PUBLISHABLE_KEY absents : l'app ne proposera que le mode démo."
          fi

      - name: Compiler pour iPhone (sans signature)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cercle.xcodeproj \
            -scheme Cercle \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || {
              # Chaque erreur devient une annotation lisible sur la page de la fabrication
              grep -E "^/.*: error: " build.log | sort -u | head -40 | while IFS= read -r l; do
                f="${l%%:*}"; reste="${l#*:}"; ligne="${reste%%:*}"
                echo "::error file=${f#$GITHUB_WORKSPACE/},line=${ligne}::${l##*error: }"
              done
              tail -n 80 build.log
              exit 1
            }
          tail -n 15 build.log

      - name: Emballer en .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Cercle.app Payload/
          zip -qry Cercle.ipa Payload
          ls -lh Cercle.ipa

      - name: Mettre le .ipa à disposition (onglet Actions, rubrique Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Cercle-ipa
          path: Cercle.ipa
          retention-days: 14
