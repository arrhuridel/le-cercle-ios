# Fabrique l'app iPhone sur un Mac de GitHub, sans signature.
# Le fichier Cercle.ipa est ensuite signé et installé depuis Windows avec Sideloadly (Apple ID gratuit).
name: Fabriquer l'app (.ipa)

on:
  push:
    branches: [main]
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

concurrency:                # un nouvel envoi annule la fabrication précédente encore en cours
  group: fabriquer-ipa
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Choisir Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode depuis project.yml
        run: xcodegen generate

      - name: Compiler pour iPhone (sans signature)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cercle.xcodeproj \
            -scheme Cercle \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 60

      - name: Emballer en .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Cercle.app Payload/
          zip -qry Cercle.ipa Payload
          ls -lh Cercle.ipa

      - name: Mettre le .ipa à disposition (onglet Actions, rubrique Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Cercle-ipa
          path: Cercle.ipa
          retention-days: 14
