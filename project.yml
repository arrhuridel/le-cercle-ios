# Description du projet Xcode, modifiable depuis Windows.
# Sur GitHub, l'outil XcodeGen transforme ce fichier en projet Xcode (Cercle.xcodeproj) avant la compilation.
name: Cercle
options:
  bundleIdPrefix: fr.lecercle
  deploymentTarget:
    iOS: "26.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.2"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Cercle:
    type: application
    platform: iOS
    sources:
      - Cercle
    dependencies:
      - package: Supabase
        product: Supabase
      # Widgets mis de côté le 08/11 : avec un Apple ID gratuit, Sideloadly ne garde pas l'espace partagé app <-> widgets.
      # Le code reste dans le dossier Widgets ; pour les remettre : dépendance « - target: CercleWidgets » et la cible.
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Le Cercle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: "Face ID protège l'accès à tes comptes."
        NSPhotoLibraryUsageDescription: "Pour lire les montants sur une capture d'écran ou un ticket."
        NSCameraUsageDescription: "Pour photographier un ticket."
        ITSAppUsesNonExemptEncryption: false
        # lecercle://ajouter et lecercle://reste : liens ouverts depuis les widgets
        CFBundleURLTypes:
          - CFBundleURLName: fr.lecercle.app
            CFBundleURLSchemes: [lecercle]
        # Remplis au moment de la fabrication par le workflow GitHub (secrets) ; vides dans le dépôt
        SupabaseURL: ""
        SupabaseKey: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lecercle.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

