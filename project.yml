# Description du projet Xcode, modifiable depuis Windows.
# Sur GitHub, l'outil XcodeGen transforme ce fichier en projet Xcode (Cercle.xcodeproj) avant la compilation.
name: Cercle
options:
  bundleIdPrefix: fr.lecercle
  deploymentTarget:
    iOS: "26.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Cercle:
    type: application
    platform: iOS
    sources:
      - Cercle
    dependencies:
      - package: Supabase
        product: Supabase
      - target: CercleWidgets      # les widgets sont rangés dans l'app (dossier PlugIns)
    entitlements:
      path: Support/Cercle.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.lecercle.app]   # espace partagé avec les widgets
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Le Cercle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: "Face ID protège l'accès à tes comptes."
        NSPhotoLibraryUsageDescription: "Pour lire les montants sur une capture d'écran ou un ticket."
        NSCameraUsageDescription: "Pour photographier un ticket."
        ITSAppUsesNonExemptEncryption: false
        # lecercle://ajouter et lecercle://reste : liens ouverts depuis les widgets
        CFBundleURLTypes:
          - CFBundleURLName: fr.lecercle.app
            CFBundleURLSchemes: [lecercle]
        # Remplis au moment de la fabrication par le workflow GitHub (secrets) ; vides dans le dépôt
        SupabaseURL: ""
        SupabaseKey: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lecercle.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  # Widgets (écran d'accueil et écran verrouillé). Ils lisent les chiffres déposés par l'app dans l'espace partagé.
  CercleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Cercle/Partage
    entitlements:
      path: Support/CercleWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.lecercle.app]
    info:
      path: Support/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Le Cercle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lecercle.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
